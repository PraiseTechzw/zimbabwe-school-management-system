# DEVELOPMENT ONLY.
# This stack uses development credentials, exposes HTTP on localhost, enables
# Laravel debug mode from .env.example and installs Composer dev dependencies.
# It is not a production deployment. See docs/operations/deployment.md.
name: zimbabwe-school-management-system

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    labels:
      environment: development
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # Laravel reads the bind-mounted .env itself. Do not inject it as process
    # environment here: that would shadow .env.testing during the test suite.
    environment:
      COMPOSER_HOME: /tmp/composer
      # Credentials come from the operator's shell or the Compose defaults below.
      # SQLite tests ignore them, so they cannot shadow .env.testing.
      DB_USERNAME: "${DB_USERNAME:-school}"
      DB_PASSWORD: "${DB_PASSWORD:-dev-only-change-me}"
    command: >-
      sh -c "composer install --no-interaction --prefer-dist --no-progress &&
      (php artisan storage:link --force >/dev/null 2>&1 || true) &&
      php-fpm -F"
    # `storage:link` creates the relative public/storage symlink at runtime;
    # the absolute host-specific symlink is intentionally not tracked in Git.
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    labels:
      environment: development
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    labels:
      environment: development
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-school}"
      MYSQL_USER: "${DB_USERNAME:-school}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-dev-only-change-me}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-dev-only-root-change-me}"
    ports:
      # Loopback only: this is a development database, not a network service.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
